system:
  name: "SarcasTone"
  version: "1.0.0"
  description: "Multimodal Sarcasm Detection Using Textual Semantics and Speech Prosody"
  seed: 42
  environment: "production"

interface_contract:
  text_hidden: 768
  audio_hidden: 768
  prosody_dim: 32
  quality_dim: 6
  sample_rate_hz: 16000
  fusion_hidden: 512
  classifier_hidden: 256
  psid_proj_dim: 128
  psid_disagree_dim: 128
  num_labels: 2
  classes:
    - "non_sarcastic"
    - "sarcastic"

backend:
  host: "0.0.0.0"
  port: 8000
  max_upload_size_mb: 25
  allowed_audio_formats:
    - ".wav"
    - ".mp3"
    - ".ogg"
    - ".flac"
  checkpoint_dir: "member3_fusion/checkpoints/full_model"

frontend:
  title: "SarcasTone: Multimodal Sarcasm Intelligence"
  port: 8501
  theme: "dark"

xai:
  captum_n_steps: 32
  top_tokens_count: 5
  top_acoustic_count: 5
  entropy_threshold: 0.55

mlops:
  mlflow_tracking_uri: "mlruns"
  experiment_name: "sarcastone_multimodal_evaluation"
  model_registry_name: "SarcasTone_CrossAttention_PSID"
